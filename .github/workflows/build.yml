name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Make sure Android SDK 36 is installed
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          fi

      # unsigned release APK; signing + zipalign are done by uber-apk-signer below
      - name: Build release APK (unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Sign with uber-apk-signer (embedded debug key)
        run: |
          curl -fsSL -o uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar uber-apk-signer.jar --apks app/build/outputs/apk/release --out signed
          ls -l signed

      - uses: actions/upload-artifact@v4
        with:
          name: wolt-watch-apk
          path: signed/*.apk
