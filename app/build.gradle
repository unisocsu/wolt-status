plugins {
    id 'com.android.application'
}

android {
    namespace 'com.woltwatch'
    compileSdk 36

    defaultConfig {
        applicationId "com.woltwatch"
        minSdk 19
        targetSdk 36
        versionCode 4
        versionName "0.4"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding "UTF-8"
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
// no dependencies on purpose: no AndroidX, only the platform SDK
